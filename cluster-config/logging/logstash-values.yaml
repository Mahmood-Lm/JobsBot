service:
  type: NodePort
  ports:
    - name: beats
      port: 5044
      targetPort: 5044
      # Expose externally as 30092 to match Filebeat & Security Groups
      nodePort: 30092 
      protocol: TCP

# To fix the license checker error
logstashConfig:
  logstash.yml: |
    http.host: "0.0.0.0"
    xpack.monitoring.elasticsearch.hosts: [ "https://elasticsearch-master:9200" ]
    xpack.monitoring.elasticsearch.username: "elastic"
    xpack.monitoring.elasticsearch.password: "${cat /usr/share/logstash/config/certs/password}"
    xpack.monitoring.elasticsearch.ssl.verification_mode: none

logstashPipeline:
  logstash.conf: |
    input {
      beats {
        port => 5044
      }
    }
    output {
      elasticsearch {
        hosts => ["https://elasticsearch-master:9200"]
        user => "${ELASTICSEARCH_USERNAME}"
        password => "${ELASTICSEARCH_PASSWORD}"
        ssl_certificate_verification => false
        index => "bot-logs-%{+YYYY.MM.dd}"
      }
    }

extraEnvs:
  - name: ELASTICSEARCH_USERNAME
    value: "elastic"
  - name: ELASTICSEARCH_PASSWORD
    valueFrom:
      secretKeyRef:
        name: elasticsearch-master-credentials
        key: password