service:
  type: NodePort
  ports:
    - name: beats
      port: 30092
      targetPort: 30092
      nodePort: 30092 
      protocol: TCP

# Inject the password securely as an environment variable
extraEnvs:
  - name: ELASTICSEARCH_PASSWORD
    valueFrom:
      secretKeyRef:
        name: elasticsearch-master-credentials
        key: password

# Use the environment variable for monitoring
logstashConfig:
  logstash.yml: |
    http.host: "0.0.0.0"
    xpack.monitoring.elasticsearch.hosts: [ "https://elasticsearch-master:9200" ]
    xpack.monitoring.elasticsearch.username: "elastic"
    xpack.monitoring.elasticsearch.password: "${ELASTICSEARCH_PASSWORD}"
    xpack.monitoring.elasticsearch.ssl.verification_mode: none

# If the log came from Filebeat and has a true timestamp in the message payload or metadata,
# force Logstash to use it as the main Elasticsearch @timestamp.
# Try to extract the true time from the AWS CloudWatch event data
logstashPipeline:
  logstash.conf: |
    input {
      beats {
        port => 30092
      }
    filter {
      if [timestamp] {
        date {
          match => [ "timestamp", "UNIX_MS" ]
          target => "@timestamp"
        }
      }
    }
    output {
      elasticsearch {
        hosts => ["https://elasticsearch-master:9200"]
        user => "elastic"
        password => "${ELASTICSEARCH_PASSWORD}"
        ssl_certificate_verification => false
        index => "bot-logs-%{+YYYY.MM.dd}"
      }
    }